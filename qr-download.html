<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Perch</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #EAF1FF 0%, #ffffff 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(37, 99, 235, 0.14);
      max-width: 360px;
      width: 100%;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #2563EB;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 28px;
    }

    .qr-wrapper {
      background: #F8FAFF;
      border: 2px solid #DBEAFE;
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
      margin-bottom: 24px;
    }

    #qrcode canvas, #qrcode img {
      display: block;
      border-radius: 8px;
    }

    .instruction {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 12px;
      color: #9CA3AF;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      background: #EFF6FF;
      color: #2563EB;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <img src="./apps/mobile/assets/refined-logo.png" class="logo-img" alt="Perch" />
      <span class="brand">Perch</span>
    </div>
    <p class="tagline">Community-driven parking discovery</p>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <p class="instruction">Scan to download</p>
    <p class="sub">
      Point your camera at the QR code<br />
      to get the latest Perch APK
    </p>

    <div class="badge">
      <span>📱</span> Android APK
    </div>
  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://drive.google.com/drive/folders/1AJcwFWDyNGA-LTTUIwcAmS34JIj1o3tK?role=reader',
      width: 220,
      height: 220,
      colorDark: '#1D4ED8',
      colorLight: '#F8FAFF',
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>
</body>
</html>
