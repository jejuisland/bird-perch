services:
  - type: web
    name: perch-api
    env: node
    region: singapore
    plan: free
    buildCommand: pnpm install && pnpm --filter @perch/api build
    startCommand: node apps/api/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: aws-1-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      - key: DB_USERNAME
        value: postgres.trupfmmxeyocmistzkkx
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: true
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Perch <onboarding@resend.dev>"
      - key: SUPABASE_URL
        value: https://trupfmmxeyocmistzkkx.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: parking-photos
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
